services:
  - type: web
    name: ntee-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false        # Set manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false        # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false        # Set manually in Render dashboard
      - key: CLIENT_URL
        sync: false        # Set to your Vercel URL e.g. https://ntee.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
